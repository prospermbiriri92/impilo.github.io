
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impilo Chat</title>

<style>
/* ============================================
   IMPILO CHAT - FRONTEND STYLES
   ============================================ */

*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  background: #111b21;
  color:white;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}
body.logged-in{
  display:block;
}

/* ================= LOGIN ================= */
.login-container{
  width:350px;
  padding:30px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  text-align:center;
}
.app {
  display: none;
  height: 100vh;
  width: 100%;
}
.app.active {
  display: flex;
}
.app-name{
  font-size:14px;
  opacity:0.6;
  margin-bottom:5px;
}
.login-container h2{
  margin-bottom:15px;
}
.login-avatar { 
  width:80px;
  height:80px;
  border-radius:50%;
  margin-bottom:10px;
  border:3px solid rgba(255,255,255,0.2);
  box-shadow:0 0 15px rgba(56,189,248,0.5);
}
.status{
  font-size:13px;
  color:#38bdf8;
  margin-bottom:15px;
  min-height:18px;
}
.input-group{
  margin-bottom:12px;
  text-align:left;
}
.input-group input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background: rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
}
.input-group input::placeholder{
  color:rgba(255,255,255,0.4);
}
.btn-group{
  display:flex;
  gap:10px;
}
.signUp-btn, .login-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background: linear-gradient(135deg,#38bdf8,#6366f1);
  color:white;
  cursor:pointer;
  transition:0.3s;
  font-size:14px;
  font-weight:600;
}
.signUp-btn:hover, .login-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(56,189,248,0.3);
}
.login-btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}
.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,0.2);
  border-top:2px solid #38bdf8;
  border-radius:50%;
  animation: spin 1s linear infinite;
  display:inline-block;
  margin-left:5px;
  vertical-align:middle;
}
@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ================= SIDEBAR ================= */
.sidebar{
  width:30%;
  background:#111b21;
  display:flex;
  flex-direction:column;
  border-right:1px solid #222;
  min-width:280px;
}
.header{
  padding:15px;
  background:#202c33;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.search{
  padding:10px;
}
.search input{
  width:100%;
  padding:10px;
  border-radius:20px;
  border:none;
  background:#202c33;
  color:white;
  font-size:14px;
}
.search input::placeholder{
  color:rgba(255,255,255,0.4);
}

/* ================= CONTACT ITEM ================= */
.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
  transition:0.2s;
  position:relative;
}
.item:hover{
  background:#1f2c34;
}

/* Avatar with online indicator */
.contact-avatar-wrap{
  position:relative;
  flex-shrink:0;
}
.contact-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:linear-gradient(135deg,#38bdf8,#6366f1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  color:white;
}

/* 🔥 ONLINE STATUS DOT */
.online-dot{
  position:absolute;
  bottom:2px;
  right:2px;
  width:12px;
  height:12px;
  background:#25d366;
  border-radius:50%;
  border:2px solid #111b21;
  display:none;
}
.online-dot.active{
  display:block;
}

.contact-info{
  flex:1;
  min-width:0;
}
.contact-name{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.contact-email{
  font-size:11px;
  opacity:0.6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.contact-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.badge{
  background:#25d366;
  color:black;
  font-size:11px;
  padding:3px 7px;
  border-radius:50px;
  font-weight:700;
}
.delete-btn{
  color:#ff4d4d;
  cursor:pointer;
  font-size:14px;
  padding:5px;
  transition:0.2s;
}
.delete-btn:hover{
  transform:scale(1.2);
}

/* ================= CHAT AREA ================= */
.chat-area{
  width:70%;
  display:flex;
  flex-direction:column;
  position:relative;
}
.chat-header{
  padding:15px;
  background:#202c33;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}
.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.message{
  max-width:65%;
  padding:10px 14px;
  border-radius:10px;
  word-break:break-word;
}
.sent{
  align-self:flex-end;
  background:#005c4b;
}
.received{
  align-self:flex-start;
  background:#202c33;
}
.meta{
  font-size:10px;
  opacity:0.6;
  margin-top:5px;
  text-align:right;
}

/* ================= INPUT AREA ================= */
.input-area{
  display:flex;
  padding:10px;
  background:#202c33;
  gap:10px;
  align-items:center;
}
.input-area input{
  flex:1;
  padding:10px 15px;
  border:none;
  border-radius:20px;
  background:white;
  color:black;
  font-size:14px;
}
.send-btn{
  background:#00a884;
  border:none;
  padding:10px 15px;
  border-radius:50%;
  cursor:pointer;
  color:white;
  font-size:16px;
  transition:0.2s;
}
.send-btn:hover{
  background:#00d68f;
}
.attach-btn{
  background:transparent;
  border:none;
  color:white;
  font-size:20px;
  cursor:pointer;
  padding:5px;
}

/* ================= SECTION HEADERS ================= */
.section-header{
  padding:10px 15px;
  font-size:13px;
  font-weight:700;
  opacity:0.7;
  text-transform:uppercase;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  gap:8px;
}
.add-btn{
  width:calc(100% - 20px);
  margin:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
  transition:0.2s;
  font-size:13px;
}
.add-btn:hover{
  background:rgba(255,255,255,0.15);
}

/* ================= IMAGE VIEWER ================= */
.image-viewer{
  position: fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background: rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.image-viewer.active{
  display:flex;
}
.image-viewer img{
  max-width:95%;
  max-height:95%;
  object-fit: contain;
  border-radius:10px;
}
.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  font-size:25px;
  cursor:pointer;
  color:white;
  z-index:10000;
}

/* ================= MOBILE ================= */
@media (max-width: 768px){
  body{
    display:block;
  }
  .login-container{
    width:90%;
    margin:40px auto;
  }
  .sidebar{
    width:100%;
    height:100vh;
  }
  .chat-area{
    width:100%;
    height:100vh;
    display:none;
  }
  .chat-active .sidebar{
    display:none;
  }
  .chat-active .chat-area{
    display:flex;
  }
}

.hidden{
  display:none !important;
}

/* ================= SCROLLBAR ================= */
::-webkit-scrollbar{
  width:6px;
}
::-webkit-scrollbar-track{
  background:transparent;
}
::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.2);
  border-radius:3px;
}
::-webkit-scrollbar-thumb:hover{
  background:rgba(255,255,255,0.3);
}
</style>

<body>

<!-- ============================================
     LOGIN SCREEN
     ============================================ -->
<div id="auth" class="login-container">
  <div class="app-name">Impilo Chat</div>
  <img src="https://i.pravatar.cc/150?img=5" class="login-avatar" alt="avatar">
  <h2>Login / Sign Up</h2>
  <div class="status" id="statusText"></div>
  <div class="input-group">
    <input id="email" type="email" placeholder="Email">
  </div>
  <div class="input-group">
    <input id="password" type="password" placeholder="Password">
  </div>
  <div class="btn-group">
    <button class="signUp-btn" onclick="signUp()">Sign Up</button>
    <button class="login-btn" onclick="login()">Login</button>
  </div>
</div>

<!-- ============================================
     CHAT APP
     ============================================ -->
<div class="app" id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="header" id="chatHeaderLeft">
      <span onclick="goBack()" style="cursor:pointer; font-size:20px;">⬅</span>
      <span id="chatName">Select chat</span>
    </div>
    <div class="search">
      <input placeholder="Search or start a new chat">
    </div>

    <!-- CONTACTS -->
    <div class="section-header">👤 Contacts</div>
    <div id="contacts"></div>
    <button class="add-btn" onclick="addContact()">+ Add Contact</button>

    <!-- GROUPS -->
    <div class="section-header">👥 Groups</div>
    <div id="groups"></div>
    <button class="add-btn" onclick="createGroup()">+ New Group</button>
  </div>

  <!-- IMAGE VIEWER -->
  <div id="imageViewer" class="image-viewer">
    <span class="close-btn" onclick="closeImage()">✖</span>
    <img id="viewerImg" alt="view">
  </div>  

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      Select chat
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <input id="msg" placeholder="Type a message">
      <button class="send-btn" onclick="sendMessage()">➤</button>
      <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect()">
    </div>
  </div>

</div>

<!-- ============================================
     JAVASCRIPT - FRONTEND LOGIC
     ============================================ -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ============================================
// CONFIG - Replace with your Supabase credentials
// ============================================
const SUPABASE_URL = "https://oaofoprncxrimzitsaub.supabase.co"
const SUPABASE_KEY = "sb_publishable_m-2zavLsmhwP8avOPSSIGg_AT_auUq6"

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

// ============================================
// STATE
// ============================================
let user = null
let presenceChannel = null
let onlineStatusChannel = null
let shownMessages = new Set()
let currentChatId = null
let currentChatName = ""
let chatChannel = null
let onlineUsers = new Set() // emails of online users

// DOM Elements
const emailEl = document.getElementById("email")
const passwordEl = document.getElementById("password")
const box = document.getElementById("messages")

// ============================================
// AUTH FUNCTIONS
// ============================================

window.login = async () => {
  const status = document.getElementById("statusText")
  status.innerHTML = "Logging in <span class='spinner'></span>"

  const { error } = await supabase.auth.signInWithPassword({
    email: emailEl.value,
    password: passwordEl.value
  })

  if(error){
    status.innerText = error.message
  } else {
    status.innerText = "Success!"
    showChat()
  }
}

window.signUp = async () => {
  const status = document.getElementById("statusText")
  status.innerHTML = "Signing up <span class='spinner'></span>"

  const { error } = await supabase.auth.signUp({
    email: emailEl.value,
    password: passwordEl.value
  })

  if(error){
    status.innerText = error.message
  } else {
    status.innerText = "Check your email for confirmation!"
  }
}

window.logout = async () => {
  // Set offline before logout
  if(user){
    await updateOnlineStatus(false)
  }
  await supabase.auth.signOut()
  location.reload()
}

// ============================================
// SESSION CHECK
// ============================================
const { data: { session } } = await supabase.auth.getSession()
if(session) showChat()

// ============================================
// UI FUNCTIONS
// ============================================

async function showChat(){
  document.getElementById("auth").classList.add("hidden")
  const app = document.getElementById("app")
  app.classList.add("active")
  document.body.classList.add("logged-in")

  const { data: { user: u } } = await supabase.auth.getUser()
  user = u

  if(!user){
    alert("No user session")
    return
  }

  loadContacts()
  loadGroups()
  setupOnlineStatus()      // NEW: Track own online status
  subscribeToOnlineStatus() // NEW: Listen to others' online status
}

window.goBack = () => {
  document.getElementById("app").classList.remove("chat-active")
}

const chatBackgrounds = {
  default: "https://images.unsplash.com/photo-151436991641-6745cdb1723f",
  group: "https://images.unsplash.com/photo-150752428034-b723cf961d3e"
}

// ============================================
// ONLINE STATUS - NEW FEATURE
// ============================================

// Update own status in database
async function updateOnlineStatus(isOnline){
  if(!user) return

  const { error } = await supabase
    .from('user_online_status')
    .upsert({
      user_id: user.id,
      email: user.email,
      is_online: isOnline,
      last_seen: new Date().toISOString()
    }, { onConflict: 'user_id' })

  if(error) console.error('Online status error:', error)
}

// Set up heartbeat to keep status online
function setupOnlineStatus(){
  // Set online immediately
  updateOnlineStatus(true)

  // Heartbeat every 30 seconds
  setInterval(() => {
    updateOnlineStatus(true)
  }, 30000)

  // Set offline on page unload
  window.addEventListener('beforeunload', () => {
    updateOnlineStatus(false)
  })

  // Set offline when tab hidden (optional - you can remove this if you want "always online" while app is open)
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      updateOnlineStatus(false)
    } else {
      updateOnlineStatus(true)
    }
  })
}

// Subscribe to online status changes of ALL users
function subscribeToOnlineStatus(){
  onlineStatusChannel = supabase
    .channel('online-status')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'user_online_status'
      },
      payload => {
        const record = payload.new
        if(record && record.email){
          if(record.is_online){
            onlineUsers.add(record.email)
          } else {
            onlineUsers.delete(record.email)
          }
          // Refresh contacts to show updated dots
          loadContacts()
        }
      }
    )
    .subscribe()
}

// ============================================
// CONTACTS
// ============================================

window.addContact = async () => {
  const email = prompt("Enter contact email:")
  if(!email) return

  const { data: existing } = await supabase
    .from("contacts")
    .select("*")
    .eq("user_id", user.id)
    .eq("contact_email", email)

  if(existing && existing.length > 0){
    alert("Already added")
    return
  }

  await supabase.from("contacts").insert({
    user_id: user.id,
    contact_email: email
  })

  loadContacts()
}

async function loadContacts(){
  const { data, error } = await supabase
    .from("contacts")
    .select("*")
    .eq("user_id", user.id)

  if(error){
    console.error("Contacts error:", error)
    return
  }

  const container = document.getElementById("contacts")
  container.innerHTML = ""

  for (const c of data){
    const chatId = [user.email, c.contact_email].sort().join("-")

    // Get unread count
    const { data: unread } = await supabase
      .from("messages")
      .select("*")
      .eq("chat_id", chatId)
      .eq("seen", false)
      .neq("user_email", user.email)

    const unreadCount = unread ? unread.length : 0

    // 🔥 CHECK IF CONTACT IS ONLINE
    const isOnline = onlineUsers.has(c.contact_email)

    const div = document.createElement("div")
    div.className = "item"
    div.dataset.email = c.contact_email

    div.innerHTML = `
      <div class="contact-avatar-wrap">
        <div class="contact-avatar">${c.contact_email[0].toUpperCase()}</div>
        <div class="online-dot ${isOnline ? 'active' : ''}"></div>
      </div>
      <div class="contact-info">
        <div class="contact-name">${c.contact_email.split("@")[0]}</div>
        <div class="contact-email">${c.contact_email}</div>
      </div>
      <div class="contact-right">
        ${unreadCount > 0 ? `<div class="badge">${unreadCount}</div>` : ""}
        <div class="delete-btn">🗑</div>
      </div>
    `

    div.onclick = () => openPrivateChat(c.contact_email)

    div.querySelector(".delete-btn").onclick = async (e) => {
      e.stopPropagation()
      if(!confirm("Delete contact?")) return
      await supabase.from("contacts").delete().eq("id", c.id)
      loadContacts()
    }

    container.appendChild(div)
  }
}

// ============================================
// GROUPS
// ============================================

window.createGroup = async () => {
  const name = prompt("Group name:")
  if(!name) return

  const { data: group } = await supabase
    .from("groups")
    .insert({ name, created_by: user.id })
    .select()
    .single()

  await supabase.from("group_members").insert({
    group_id: group.id,
    user_id: user.id
  })

  alert("Group created!")
  loadGroups()
}

async function loadGroups(){
  const { data } = await supabase
    .from("group_members")
    .select("groups(id,name)")
    .eq("user_id", user.id)

  const container = document.getElementById("groups")
  container.innerHTML = ""

  data.forEach(g => {
    if(!g.groups) return
    const div = document.createElement("div")
    div.className = "item"
    div.innerHTML = `
      <div class="contact-avatar-wrap">
        <div class="contact-avatar">👥</div>
      </div>
      <div class="contact-info">
        <div class="contact-name">${g.groups.name}</div>
      </div>
    `
    div.onclick = () => openGroupChat(g.groups.id, g.groups.name)
    container.appendChild(div)
  })
}

// ============================================
// CHAT FUNCTIONS
// ============================================

function openPrivateChat(email){
  currentChatId = [user.email, email].sort().join("-")
  currentChatName = email
  shownMessages.clear()

  document.getElementById("chatName").innerText = email
  document.getElementById("chatHeader").innerText = email

  document.querySelector(".chat-area").style.background =
    `url('${chatBackgrounds.default}') center/cover`

  box.innerHTML = ""
  loadMessages()
  setupRealtime()

  document.getElementById("app").classList.add("chat-active")
}

function openGroupChat(id, name){
  currentChatId = "group-" + id
  currentChatName = name
  shownMessages.clear()

  document.getElementById("chatName").innerText = name
  document.getElementById("chatHeader").innerText = name

  document.querySelector(".chat-area").style.background =
    `url('${chatBackgrounds.group}') center/cover`

  box.innerHTML = ""
  loadMessages()
  setupRealtime()

  document.getElementById("app").classList.add("chat-active")
}

// ============================================
// MESSAGES
// ============================================

window.sendMessage = async () => {
  const input = document.getElementById("msg")
  const fileInput = document.getElementById("fileInput")

  const msg = input.value.trim()
  const file = fileInput.files[0]

  if(!msg && !file){
    alert("Type message or select file")
    return
  }

  let fileUrl = null

  if(file){
    const fileName = Date.now() + "-" + file.name
    const filePath = `${user.id}/${fileName}`

    const { error: uploadError } = await supabase.storage
      .from("chat-files")
      .upload(filePath, file)

    if(uploadError){
      alert(uploadError.message)
      return
    }

    const { data } = supabase.storage
      .from("chat-files")
      .getPublicUrl(filePath)

    fileUrl = data.publicUrl
  }

  const { data, error } = await supabase
    .from("messages")
    .insert({
      chat_id: currentChatId,
      content: msg,
      user_email: user.email,
      file_url: fileUrl,
      seen: false
    })
    .select()
    .single()

  if(error){
    alert(error.message)
    return
  }

  addMessage(data)
  input.value = ""
  fileInput.value = ""
}

async function loadMessages(){
  if(!currentChatId) return

  const { data, error } = await supabase
    .from("messages")
    .select("*")
    .eq("chat_id", currentChatId)
    .order("created_at", { ascending: true })

  if(error){
    console.error(error)
    return
  }

  box.innerHTML = ""
  data.forEach(addMessage)

  // Mark as seen
  await supabase
    .from("messages")
    .update({ seen: true })
    .eq("chat_id", currentChatId)
    .neq("user_email", user.email)

  // Refresh contact unread badges
  loadContacts()
}

function addMessage(m){
  if(shownMessages.has(m.id)) return
  shownMessages.add(m.id)

  const div = document.createElement("div")
  const isMine = m.user_email === user.email
  div.className = "message " + (isMine ? "sent" : "received")

  const time = new Date(m.created_at).toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
  })

  const ticks = isMine ? (m.seen ? "✓✓" : "✓") : ""

  div.innerHTML = `
    <b>${m.user_email}</b><br>
    ${m.content || ""}
    ${m.file_url ? renderFile(m.file_url) : ""}
    <div class="meta">
      ${time} ${ticks}
    </div>
  `

  box.appendChild(div)
  box.scrollTop = box.scrollHeight
}

function renderFile(url){
  if(!url) return ""
  const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(url)

  if(isImage){
    return `<br><img src="${url}" onclick="openImage('${url}')" style="max-width:250px;width:100%;border-radius:10px;margin-top:5px;cursor:pointer;">`
  }

  return `<br><a href="${url}" target="_blank" style="color:#4da6ff;">📎 Open File</a>`
}

window.handleFileSelect = () => {
  const fileInput = document.getElementById("fileInput")
  if(fileInput.files[0]){
    document.getElementById("msg").placeholder = `File: ${fileInput.files[0].name} (type a caption or send)`
  }
}

// ============================================
// REALTIME
// ============================================

function setupRealtime(){
  if(chatChannel){
    supabase.removeChannel(chatChannel)
  }

  chatChannel = supabase
    .channel("chat-" + currentChatId)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: `chat_id=eq.${currentChatId}`
      },
      payload => {
        addMessage(payload.new)
        loadContacts()
      }
    )
    .subscribe()
}

// ============================================
// IMAGE VIEWER
// ============================================

window.openImage = function(url){
  const viewer = document.getElementById("imageViewer")
  document.getElementById("viewerImg").src = url
  viewer.classList.add("active")
}

window.closeImage = function(){
  document.getElementById("imageViewer").classList.remove("active")
}

document.getElementById("imageViewer").onclick = function(e){
  if(e.target.id === "imageViewer"){
    closeImage()
  }
}

// ============================================
// SWIPE GESTURES (Mobile)
// ============================================
let startX = 0
let endX = 0

const chatArea = document.querySelector(".chat-area")

chatArea.addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX
})

chatArea.addEventListener("touchmove", (e) => {
  endX = e.touches[0].clientX
})

chatArea.addEventListener("touchend", () => {
  let diff = endX - startX
  if(diff > 80){
    goBack()
  }
})
